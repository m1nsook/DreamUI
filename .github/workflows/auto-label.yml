name: Automatic labeling
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issues:
    types: [opened, edited]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by changed paths
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Classify new issues
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const labels = ['status:needs-triage'];
            if (/\b(bug|crash|broken|regression|error|fails?)\b/.test(title)) labels.push('type:bug');
            else if (/\b(docs?|readme|guide|tutorial)\b/.test(title)) labels.push('type:documentation');
            else if (/\b(feature|request|support|improvement|enhancement)\b/.test(title)) labels.push('type:feature');
            if (/\b(minimap|world.?map|map marker)\b/.test(title + ' ' + body)) labels.push('area:maps');
            if (/\b(loot|inventory|pickup|rarity)\b/.test(title + ' ' + body)) labels.push('area:looting');
            if (/\b(background|menu texture)\b/.test(title + ' ' + body)) labels.push('area:backgrounds');
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: context.issue.number,
              labels: [...new Set(labels)]
            });
