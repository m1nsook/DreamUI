name: Experimental test releases
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-testing.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "New prerelease tag, e.g. v0.1.0-alpha.9"
        required: true
        type: string
        default: "v0.1.0-alpha.9"
permissions:
  contents: write
concurrency:
  group: dreamui-test-release
  cancel-in-progress: false
jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v0.1.0-alpha.9' }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate requested prerelease tag
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$') {
            throw "Version must look like v0.1.0-alpha.2"
          }
      - name: Unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }
      - name: Pack default .dream theme
        shell: pwsh
        run: |
          python tools/dreamtool.py pack themes/Default dist/Default.dream
          if ($LASTEXITCODE -ne 0) { throw "Theme packing failed" }
      - name: Build Win64 .asi
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DDREAMUI_EXPERIMENTAL_NATIVE_STAGE=ON -DDREAMUI_ENABLE_NATIVE_WRITES=OFF -DDREAMUI_ENABLE_NATIVE_CLONE=OFF
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
          $requiredFlags = @(
            "DREAMUI_EXPERIMENTAL_NATIVE_STAGE:BOOL=ON",
            "DREAMUI_ENABLE_NATIVE_WRITES:BOOL=OFF",
            "DREAMUI_ENABLE_NATIVE_CLONE:BOOL=OFF"
          )
          foreach ($flag in $requiredFlags) {
            if (!(Select-String -Path "build/CMakeCache.txt" -SimpleMatch -Pattern $flag -Quiet)) {
              throw "Unsafe prerelease CMake profile: $flag"
            }
          }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "ASI build failed" }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }
      - name: Assemble install-path test ZIP and SHA256
        shell: pwsh
        run: |
          $root = "dist/staging"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force "$root/bin/x64/plugins" | Out-Null
          New-Item -ItemType Directory -Force "$root/dreamui/themes" | Out-Null
          Copy-Item "build/Release/DreamUI.asi" "$root/bin/x64/plugins/DreamUI.asi"
          Copy-Item "dist/Default.dream" "$root/dreamui/themes/Default.dream"
          Copy-Item "docs/TESTING.md" "$root/README-TESTING.md"
          if (Test-Path "$root/dreamui/dev") {
            throw "Release ZIP must never contain native opt-in marker files"
          }
          $archive = "DreamUI-$env:VERSION-win64-test.zip"
          $target = "dist/$archive"
          Compress-Archive -Path "$root/*" -DestinationPath $target -Force
          $hash = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "dist/$archive.sha256" -Encoding Ascii
          if (!(Test-Path $target)) { throw "Test ZIP missing" }
          Write-Host "Created $target | SHA256 $hash"
      - name: Keep tested install package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamUI-${{ env.VERSION }}-test
          path: |
            dist/DreamUI-*-win64-test.zip
            dist/DreamUI-*-win64-test.zip.sha256
          if-no-files-found: error
      - name: Publish GitHub prerelease (never stable/latest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Prerelease $env:VERSION already exists; skipping duplicate."
            exit 0
          }
          $archive = "dist/DreamUI-$env:VERSION-win64-test.zip"
          gh release create "$env:VERSION" "$archive" "$archive.sha256" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title "DreamUI $env:VERSION (standalone native Ink load diagnostics)" --notes-file "docs/TESTING.md"
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease publication failed" }
