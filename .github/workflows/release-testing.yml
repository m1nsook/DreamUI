name: Experimental test releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-testing.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Prerelease tag, e.g. v0.1.0-alpha.9"
        required: true
        type: string
        default: "v0.1.0-alpha.9"

permissions:
  contents: write

concurrency:
  group: dreamui-test-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v0.1.0-alpha.9' }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate requested prerelease tag and compiled version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$') {
            throw "Invalid prerelease version: $env:VERSION"
          }
          $expected = 'kDreamUIVersion = "' + $env:VERSION + '"'
          if (!(Select-String -Path "include/dreamui/control_hub.hpp" -SimpleMatch -Pattern $expected -Quiet)) {
            throw "Compiled DreamUI version does not match prerelease version $env:VERSION"
          }

      - name: Unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }

      - name: Pack default theme
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist" | Out-Null
          python tools/dreamtool.py pack themes/Default dist/Default.dream
          if ($LASTEXITCODE -ne 0) { throw "Theme packaging failed" }

      - name: Configure safe native observation build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DDREAMUI_EXPERIMENTAL_NATIVE_STAGE=ON -DDREAMUI_ENABLE_NATIVE_WRITES=OFF -DDREAMUI_ENABLE_NATIVE_CLONE=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          $requiredFlags = @(
            "DREAMUI_EXPERIMENTAL_NATIVE_STAGE:BOOL=ON",
            "DREAMUI_ENABLE_NATIVE_WRITES:BOOL=OFF",
            "DREAMUI_ENABLE_NATIVE_CLONE:BOOL=OFF"
          )
          foreach ($flag in $requiredFlags) {
            if (!(Select-String -Path "build/CMakeCache.txt" -SimpleMatch -Pattern $flag -Quiet)) {
              throw "Unsafe/incomplete release configuration: $flag"
            }
          }

      - name: Build standalone Win64 ASI
        shell: pwsh
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Native ASI build failed" }

      - name: Run native tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }

      - name: Assemble clean install ZIP and SHA256
        shell: pwsh
        run: |
          $staging = "dist/staging"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force "$staging/bin/x64/plugins" | Out-Null
          New-Item -ItemType Directory -Force "$staging/dreamui/themes" | Out-Null
          Copy-Item "build/Release/DreamUI.asi" "$staging/bin/x64/plugins/DreamUI.asi"
          Copy-Item "dist/Default.dream" "$staging/dreamui/themes/Default.dream"
          Copy-Item "docs/TESTING.md" "$staging/README-TESTING.md"
          if (Test-Path "$staging/dreamui/dev") {
            throw "Release ZIP must never contain native opt-in marker files"
          }
          $archive = "DreamUI-$env:VERSION-win64-test.zip"
          $target = "dist/$archive"
          Compress-Archive -Path "$staging/*" -DestinationPath $target -Force
          if (!(Test-Path $target)) { throw "Missing release ZIP" }
          $hash = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "dist/$archive.sha256" -Encoding Ascii
          Write-Host "Packaged $target | SHA256 $hash"

      - name: Archive exact tested package
        uses: actions/upload-artifact@v4
        with:
          name: DreamUI-${{ env.VERSION }}-test
          path: |
            dist/DreamUI-*-win64-test.zip
            dist/DreamUI-*-win64-test.zip.sha256
          if-no-files-found: error

      - name: Publish prerelease only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release tag $env:VERSION already exists; refusing to replace an existing artifact"
          }
          $archive = "dist/DreamUI-$env:VERSION-win64-test.zip"
          gh release create "$env:VERSION" "$archive" "$archive.sha256" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title "DreamUI $env:VERSION (standalone native Ink loading diagnostics)" --notes-file "docs/TESTING.md"
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease publication failed" }
